services:
    wros2_jazzy_ws:
        build:
            context: "docker"
            dockerfile: "Dockerfile"
        container_name: wros2_jazzy_container
        environment:
            - DISPLAY=${DISPLAY}
            - QT_X11_NO_MITSHM=1
            - ROS_HOSTNAME=localhost
            - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
            - FASTDDS_SHM_DISABLE=1
            - ROS_DOMAIN_ID=0
        volumes:
            - /dev:/dev
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - ./ros2_ws/jazzy/src/wros2_tutorials:/ros2_ws/src/wros2_tutorials
        privileged: true
        tty: true
        network_mode: host
        command: bash -c "source /opt/ros/jazzy/setup.bash && colcon build --symlink-install --executor sequential && bash"
